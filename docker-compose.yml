services:

  neo4j:
    image: neo4j:5.26-community
    container_name: datastack-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$${HEALTHCHECK_PASSWORD}" "RETURN 1" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: datastack-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_models:/root/.ollama


  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 10 &&
        ollama pull llama3.2
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: datastack-app
    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      LLM_PROVIDER: "${LLM_PROVIDER}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL}"

      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2

    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

    volumes:
      - ./app:/app/app
      - huggingface_cache:/root/.cache/huggingface

volumes:
  neo4j_data:
  neo4j_logs:
  huggingface_cache:
  ollama_models: