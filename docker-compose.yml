
services:

  neo4j:
    image: neo4j:5.26-community
    container_name: datastack-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$$NEO4J_PASSWORD" "RETURN 1" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: datastack-app
    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"

    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
